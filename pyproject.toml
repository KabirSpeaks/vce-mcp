[project]
name = "vce-mcp"
version = "0.1.0"
description = "Vardhaman College of Engineering Institutional Knowledge MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "PyPDF2>=3.0.1",
    "SQLAlchemy>=2.0.30",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.1",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.52.4",
    "starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
vce-mcp = "vce_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vce_mcp"]
